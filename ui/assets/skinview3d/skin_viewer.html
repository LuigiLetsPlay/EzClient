<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EzClient 3D Skin Viewer</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  #container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  canvas {
    outline: none;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
</style>
<script src="skinview3d.bundle.js"></script>
</head>
<body>
<div id="container">
  <canvas id="skin_canvas"></canvas>
</div>

<script>
  let skinViewer = null;
  let currentAnim = null;
  let isAutoRotating = false;
  let pendingSkin = null;
  let idleLookTime = 0;

  function init() {
    const canvas = document.getElementById("skin_canvas");
    const container = document.getElementById("container");
    const w = container.clientWidth || 240;
    const h = container.clientHeight || 300;

    skinViewer = new skinview3d.SkinViewer({
      canvas: canvas,
      width: w,
      height: h
    });

    // Camera settings
    skinViewer.camera.position.x = 0;
    skinViewer.camera.position.y = 0;
    skinViewer.camera.position.z = 65;

    // Enhanced lighting for crisp Minecraft 3D look
    if (skinViewer.renderer) {
      skinViewer.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }

    // High-resolution community capes stay sharp in the visible 10x16 face.
    // SkinView3D defaults to nearest filtering for the classic pixel look; use
    // linear filtering/anisotropy only for the cape texture.
    const originalRecreateCapeTexture = skinViewer.recreateCapeTexture.bind(skinViewer);
    skinViewer.recreateCapeTexture = function() {
      originalRecreateCapeTexture();
      const texture = skinViewer.capeTexture;
      if (texture) {
        texture.magFilter = 1006; // THREE.LinearFilter
        texture.minFilter = 1006;
        texture.anisotropy = skinViewer.renderer.capabilities.getMaxAnisotropy();
        texture.needsUpdate = true;
      }
    };

    // Keep the full character and cape visible. The previous default was much
    // closer and made high-detail capes look cropped next to the Cape page.
    skinViewer.zoom = 0.68;

    // Controls
    skinViewer.controls.enableRotate = true;
    skinViewer.controls.enableZoom = true;
    skinViewer.controls.enablePan = false;
    skinViewer.controls.maxDistance = 120;
    skinViewer.controls.minDistance = 30;

    // Home controls the pose explicitly.  Do not run random/idle movement in
    // the launcher preview; a static character is predictable and clickable.
    setAnimation("none");

    if (pendingSkin) {
      setSkin(pendingSkin.url, pendingSkin.model);
      pendingSkin = null;
    } else {
      setSkin("../skins/steve.png", "classic");
    }

    window.addEventListener("resize", () => {
      if (skinViewer) {
        skinViewer.setSize(container.clientWidth, container.clientHeight);
      }
    });

    canvas.addEventListener("pointerdown", handleInteractionStart, true);
    canvas.addEventListener("pointermove", handleInteractionMove, true);
    canvas.addEventListener("pointerup", handleInteractionEnd, true);
    canvas.addEventListener("pointercancel", handleInteractionEnd, true);
    canvas.addEventListener("pointerout", (e) => {
      if (isDragging) handleInteractionEnd();
    }, true);
  }

  function setSkin(textureUrl, modelType) {
    if (!skinViewer) {
      pendingSkin = { url: textureUrl, model: modelType };
      return;
    }
    const opt = {};
    if (modelType === "slim") {
      opt.model = "slim";
    } else {
      opt.model = "default";
    }
    const targetUrl = textureUrl || "../skins/steve.png";
    skinViewer.loadSkin(targetUrl, opt).catch(err => {
      console.warn("SkinView3D loadSkin note:", err);
    });
  }

  let capeAnimTimer = null;
  let capeAnimImg = null;
  let capeAnimCanvas = null;
  let capeAnimCtx = null;

  function stopCapeAnimation() {
    if (capeAnimTimer) {
      clearInterval(capeAnimTimer);
      capeAnimTimer = null;
    }
    capeAnimImg = null;
  }

  function setCape(capeUrl) {
    stopCapeAnimation();
    if (!skinViewer) return;
    if (!capeUrl) {
      skinViewer.resetCape();
    } else {
      skinViewer.loadCape(capeUrl);
    }
  }

  function setAnimatedCape(sheetUrl, frameCount, fps, columns, frameW, frameH, pingPong) {
    stopCapeAnimation();
    if (!skinViewer || !sheetUrl) return;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      capeAnimImg = img;
      const count = Math.max(1, Number(frameCount) || 1);
      const fFps = Math.max(1, Math.min(60, Number(fps) || 12));
      const cols = Math.max(1, Number(columns) || count);
      const fw = Math.max(1, Number(frameW) || 256);
      const fh = Math.max(1, Number(frameH) || 128);
      const intervalMs = Math.max(16, Math.round(1000 / fFps));

      if (skinViewer.capeCanvas) {
        skinViewer.capeCanvas.width = fw;
        skinViewer.capeCanvas.height = fh;
        skinViewer.recreateCapeTexture();
      }

      let currentFrame = 0;

      function renderFrame(idx) {
        if (!skinViewer || !capeAnimImg || !skinViewer.capeCanvas) return;
        const validIdx = Math.max(0, Math.min(count - 1, ((idx % count) + count) % count));
        const col = validIdx % cols;
        const row = Math.floor(validIdx / cols);
        const sx = col * fw;
        const sy = row * fh;

        const skinCapeCtx = skinViewer.capeCanvas.getContext("2d", { willReadFrequently: true });
        if (skinCapeCtx) {
          // Draw new frame directly over canvas without clearRect / width reset to prevent 1-frame blank flicker
          skinCapeCtx.drawImage(capeAnimImg, sx, sy, fw, fh, 0, 0, fw, fh);
        }
        if (skinViewer.capeTexture) {
          skinViewer.capeTexture.needsUpdate = true;
        }
        skinViewer.playerObject.backEquipment = "cape";
        if (skinViewer.playerObject.cape) {
          skinViewer.playerObject.cape.visible = true;
        }
      }

      renderFrame(0);

      capeAnimTimer = setInterval(() => {
        if (!skinViewer || !capeAnimImg) {
          stopCapeAnimation();
          return;
        }
        currentFrame = (currentFrame + 1) % count;
        renderFrame(currentFrame);
      }, intervalMs);
    };
    img.src = sheetUrl;
  }

  function setAnimation(name, speed) {
    if (!skinViewer) return;
    const spd = speed !== undefined ? speed : 0.7;
    try {
      if (name === "idle" && skinview3d.IdleAnimation) {
        skinViewer.animation = new skinview3d.IdleAnimation();
        if (skinViewer.animation) skinViewer.animation.speed = spd;
      } else if (name === "walk" && skinview3d.WalkingAnimation) {
        skinViewer.animation = new skinview3d.WalkingAnimation();
        if (skinViewer.animation) skinViewer.animation.speed = spd;
      } else if (name === "run" && skinview3d.RunningAnimation) {
        skinViewer.animation = new skinview3d.RunningAnimation();
        if (skinViewer.animation) skinViewer.animation.speed = spd;
      } else if (name === "fly" && skinview3d.FlyingAnimation) {
        skinViewer.animation = new skinview3d.FlyingAnimation();
        if (skinViewer.animation) skinViewer.animation.speed = spd;
      } else if (name === "wave" && skinview3d.WaveAnimation) {
        skinViewer.animation = new skinview3d.WaveAnimation();
        if (skinViewer.animation) skinViewer.animation.speed = spd;
      } else {
        skinViewer.animation = null;
      }
    } catch (e) {
      console.warn("[SkinViewer] setAnimation note:", e);
    }
  }

  let resumeAutoRotateTimeout = null;
  let isDragging = false;
  let dragDist = 0;

  function setAutoRotate(enabled, speed) {
    if (!skinViewer) return;
    isAutoRotating = !!enabled;
    skinViewer.autoRotate = isAutoRotating;
    skinViewer.autoRotateSpeed = speed || 1.0;
  }

  function handleInteractionStart() {
    isDragging = false;
    dragDist = 0;
    if (resumeAutoRotateTimeout) {
      clearTimeout(resumeAutoRotateTimeout);
      resumeAutoRotateTimeout = null;
    }
    if (skinViewer && isAutoRotating) {
      skinViewer.autoRotate = false;
    }
  }

  function handleInteractionMove(e) {
    isDragging = true;
    dragDist += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0);
  }

  function handleInteractionEnd() {
    if (skinViewer && isAutoRotating) {
      resumeAutoRotateTimeout = setTimeout(() => {
        skinViewer.autoRotate = true;
      }, 3000);
    }
    if (dragDist < 5) {
      window.location.href = "ezclient://openskinmodal";
    }
  }

  function rotateY(deg) {
    if (!skinViewer) return;
    skinViewer.playerObject.rotation.y = (deg * Math.PI) / 180;
  }

  function setInitialRotation(degX, degY) {
    if (!skinViewer) return;
    if (degX !== undefined) skinViewer.playerObject.rotation.x = (degX * Math.PI) / 180;
    if (degY !== undefined) skinViewer.playerObject.rotation.y = (degY * Math.PI) / 180;
  }

  function resetView(defaultRotY) {
    if (!skinViewer) return;
    skinViewer.controls.reset();
    skinViewer.zoom = 0.68;
    skinViewer.camera.position.x = 0;
    skinViewer.camera.position.y = 0;
    skinViewer.camera.position.z = 65;
    skinViewer.playerObject.rotation.x = 0;
    skinViewer.playerObject.rotation.y = ((defaultRotY !== undefined ? defaultRotY : 0) * Math.PI) / 180;
    skinViewer.playerObject.rotation.z = 0;
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
</script>
</body>
</html>
