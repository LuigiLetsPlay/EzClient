pluginManagement {
	repositories {
		mavenCentral()
		gradlePluginPortal()
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.legacyfabric.net/' }
		maven { url = 'https://maven.kikugie.dev/releases' }
		maven { url = 'https://maven.kikugie.dev/snapshots' }
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.7'
	// Make the version available to every Stonecutter target. Applying it to
	// settings does not register it for child projects, which made every
	// version build fail during plugin resolution.
	id 'dev.kikugie.loom-back-compat' version '0.4.2' apply false
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

stonecutter {
	create(rootProject) {
		versions '1.8.9', '1.12.2', '1.16.5', '1.20.1', '1.21.1', '26.1', '26.1.1', '26.2'
		vcsVersion = '26.2'
	}
}

rootProject.name = 'EzClient'
