plugins {
	id 'dev.kikugie.loom-back-compat' version '0.4.2'
	id 'maven-publish'
}

def is_v1_8 = stonecutter.eval(stonecutter.current.version, '<=1.12.2')
def is_v1_16_v1_20 = stonecutter.eval(stonecutter.current.version, '>=1.16.5 <26')
def is_v26 = !is_v1_8 && !is_v1_16_v1_20
def is_v26_1 = stonecutter.eval(stonecutter.current.version, '>=26 <26.2')
def requiredJava = stonecutter.eval(stonecutter.current.version, '>=26') ? 25 :
        (stonecutter.eval(stonecutter.current.version, '>=1.20.5') ? 21 :
        (stonecutter.eval(stonecutter.current.version, '>=1.17') ? 17 : 8))

version = "${project.mod_version}+${stonecutter.current.version}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${stonecutter.current.version}"
}

repositories {
	maven { url = 'https://maven.legacyfabric.net/' }
	maven { url = 'https://repo.legacyfabric.net/repository/legacyfabric/' }
	maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	if (is_v1_8) {
		mappings "net.legacyfabric:yarn:${project.yarn_mappings}:v2"
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	} else if (is_v26) {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		if (project.hasProperty('fabric_api_version')) {
			include(implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"))
		}
		if (project.hasProperty('modmenu_version')) {
			implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
		}
	} else {
		mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	}
}

sourceSets {
	main {
		java {
			if (is_v1_8) {
				include 'app/ezclient/v1_8/**'
				include 'app/ezclient/shared/**'
} else if (is_v1_16_v1_20) {
include 'app/ezclient/v1_16_v1_20/**'
include 'app/ezclient/shared/**'
exclude 'app/ezclient/shared/CrossVersionHudExample.java'
} else {
				exclude 'app/ezclient/v1_8/**'
				exclude 'app/ezclient/v1_16_v1_20/**'
				exclude 'app/ezclient/shared/CrossVersionHudExample.java'
				if (is_v26_1) {
					exclude 'app/ezclient/mixin/EzNameTagLogoRenderer.java'
					exclude 'app/ezclient/mixin/LevelVisibilityMixin.java'
					exclude 'app/ezclient/mixin/VertexBuilderAccessor.java'
				}
			}
		}
	}
}

processResources {
	def props = [
		version: project.mod_version,
		minecraft_dependency: project.minecraft_dependency,
		java_dependency: project.java_dependency,
		loader_dependency: project.loader_dependency
	]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }

	if (is_v1_8) {
		exclude 'fabric.mod.json'
		exclude 'ezclient.mixins.json'
		exclude 'assets/ezclient/font/**'
		from(rootProject.file('src/v1_8/resources/fabric.mod.v1_8.json')) {
			expand props
			rename { 'fabric.mod.json' }
		}
		from(rootProject.file('src/v1_8/resources/ezclient.v1_8.mixins.json'))
	} else if (is_v1_16_v1_20) {
		exclude 'fabric.mod.json'
		exclude 'ezclient.mixins.json'
		exclude 'assets/ezclient/font/**'
		from(rootProject.file('src/v1_16_v1_20/resources/fabric.mod.v1_16_v1_20.json')) {
			expand props
			rename { 'fabric.mod.json' }
		}
		from(rootProject.file('src/v1_16_v1_20/resources/ezclient.v1_16_v1_20.mixins.json'))
	} else {
		if (is_v26_1) {
			exclude 'ezclient.mixins.json'
			from(rootProject.file('src/v26_1/resources/ezclient.v26_1.mixins.json')) {
				rename { 'ezclient.mixins.json' }
			}
		}
		from('src/main/resources/assets/ezclient/icon.png') {
			into 'assets/ezclient/textures/gui/sprites/title'
			rename { 'icon.png' }
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	if (requiredJava > 8) {
		options.release = requiredJava
	}
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(requiredJava)
	targetCompatibility = JavaVersion.toVersion(requiredJava)
	toolchain {
		languageVersion = JavaLanguageVersion.of(requiredJava)
	}
}

tasks.register('buildAndCollect', Copy) {
	group = 'build'
	description = 'Builds this Minecraft target and collects its remapped jar.'
	dependsOn tasks.named('build')
	from tasks.named('remapJar').flatMap { it.archiveFile }
	into rootProject.layout.buildDirectory.dir('libs')
}

// Explicit integration-test run; no test mod or extra dependency enters release JARs.
if (stonecutter.current.version == '26.2' && project.hasProperty('ezclientTests')) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = 'ezclient-render-tests'
            enableGameTests = false
            enableClientGameTests = true
        }
    }
    sourceSets.gametest.java.setSrcDirs([rootProject.file('src/gametest/java')])
    sourceSets.gametest.resources.setSrcDirs([rootProject.file('src/gametest/resources')])
    tasks.named('runClientGameTest') {
        environment 'APPDATA', layout.buildDirectory.dir('test-appdata').get().asFile.absolutePath
    }
}
